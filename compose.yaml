services:
  postgres:
    image: postgres:17-alpine
    container_name: petcare-postgres
    environment:
      POSTGRES_DB: petcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - petcare_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d petcare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  petcare_data:

