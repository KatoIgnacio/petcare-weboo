spring.application.name=petcare
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/petcare}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

petcare.external-api.base-url=${EXTERNAL_API_URL:http://localhost:3001}
petcare.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
petcare.external-api.connect-timeout=${EXTERNAL_API_CONNECT_TIMEOUT:2s}
petcare.external-api.read-timeout=${EXTERNAL_API_READ_TIMEOUT:10s}
petcare.notifications.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:5}
petcare.notifications.retry-delay=${NOTIFICATION_RETRY_DELAY:30s}
petcare.notifications.max-retry-delay=${NOTIFICATION_MAX_RETRY_DELAY:5m}
petcare.notifications.lease-duration=${NOTIFICATION_LEASE_DURATION:30s}
petcare.notifications.batch-size=${NOTIFICATION_BATCH_SIZE:10}
petcare.notifications.worker-enabled=${NOTIFICATION_WORKER_ENABLED:true}
petcare.notifications.worker-delay-ms=${NOTIFICATION_WORKER_DELAY_MS:5000}
petcare.notifications.worker-initial-delay-ms=${NOTIFICATION_WORKER_INITIAL_DELAY_MS:5000}

server.error.include-message=never
server.error.include-stacktrace=never

