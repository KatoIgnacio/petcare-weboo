spring.datasource.url=jdbc:h2:mem:petcare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
petcare.external-api.base-url=http://localhost:65535
petcare.cors.allowed-origins=http://localhost:3000,http://localhost:5173

